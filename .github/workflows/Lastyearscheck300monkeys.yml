# Every Saturday morning: is each agent's lead skill or luck? Replays the
# last five years with 300 monkeys, checks the live accounts the same way,
# and publishes docs/data/skill.json (dashboard: Research > Skill or luck?).
name: Skill or luck

on:
  schedule:
    # 06:00 UTC, an hour before the weekly report.
    - cron: "0 6 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    # The study takes about 45 minutes (two five-year replays with 300
    # monkeys each), and the live part grows with every week of results.
    timeout-minutes: 120
    steps:
      # The newest main, not the commit this run was started on.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A limit on the step itself, so a study that runs too long fails
      # here and the alert below still runs.
      - name: Run the study
        timeout-minutes: 105
        run: python luck_study.py --source yfinance

      - name: Commit the results
        run: |
          git config user.name "vanguard3-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/skill.json
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Skill or luck study $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

      # Opens (or adds to) one GitHub issue; GitHub emails it to the owner.
      - name: Alert if something went wrong
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The **${{ github.workflow }}** run on $(date -u '+%a %d %b %H:%M UTC') needs a look."
            echo
            echo "- The study stopped with an error or ran out of time, so the Skill or luck page was not updated. Log: $RUN_URL"
            echo
            echo "@Mits-Alt-F4 · automatic message. Close this issue once things are fine again."
          } > alert.md
          n=$(gh issue list --state open --search '"Vanguard3 needs attention" in:title' --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file alert.md
          else
            gh issue create --title "Vanguard3 needs attention" --body-file alert.md
          fi
