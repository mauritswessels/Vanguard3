# The News Analyst's second look at the news, during the trading day.
# Only that account is touched; fills are simulated at live Yahoo prices.
name: Midday news check

on:
  schedule:
    # 14:37 UTC = 16:37 Swiss time in summer (15:37 in winter). New York has
    # been open for a while and Europe still is.
    - cron: "37 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the check but save nothing"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Midday news check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python midday_news.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit results
        run: |
          git config user.name "vanguard3-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Midday news check $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

      - name: Health check
        if: always()
        run: python health_check.py --out health.md

      # Opens (or adds to) one GitHub issue; GitHub emails it to the owner.
      - name: Alert if something went wrong
        if: always() && (failure() || hashFiles('health.md') != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The **${{ github.workflow }}** run on $(date -u '+%a %d %b %H:%M UTC') needs a look."
            echo
            if [ "${{ job.status }}" != "success" ]; then
              echo "- The run itself stopped with an error. Log: $RUN_URL"
            fi
            [ -f health.md ] && cat health.md
            echo
            echo "@Mits-Alt-F4 · automatic message. Close this issue once things are fine again."
          } > alert.md
          n=$(gh issue list --state open --search '"Vanguard3 needs attention" in:title' --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file alert.md
          else
            gh issue create --title "Vanguard3 needs attention" --body-file alert.md
          fi
