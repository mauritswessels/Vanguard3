# Every Saturday morning Claude explains the week in plain words. The report
# goes on the dashboard and arrives by email as a (closed) GitHub issue.
name: Weekly report

on:
  schedule:
    # 07:00 UTC = 09:00 Swiss time in summer (08:00 in winter).
    - cron: "0 7 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The newest main, not the commit this run was started on.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write the report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python weekly_report.py --issue report.md

      - name: Commit the report
        run: |
          git config user.name "vanguard3-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # state/briefs keeps the word-for-word Claude call (CLAUDE.md).
          git add docs/data/weekly.json state/briefs
          if git diff --cached --quiet; then
            echo "No report this week"
          else
            git commit -m "Weekly report $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

      # GitHub emails new issues to the owner; closing it keeps the list tidy.
      - name: Email the report
        if: hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create --title "Weekly report: week to $(date -u +%d\ %b)" --body-file report.md)
          gh issue close "$url"

      # Opens (or adds to) one GitHub issue; GitHub emails it to the owner.
      - name: Alert if something went wrong
        if: always() && job.status != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The **${{ github.workflow }}** run on $(date -u '+%a %d %b %H:%M UTC') needs a look."
            echo
            echo "- This week's report could not be written. Log: $RUN_URL"
            echo
            echo "@Mits-Alt-F4 · automatic message. Close this issue once things are fine again."
          } > alert.md
          n=$(gh issue list --state open --search '"Vanguard3 needs attention" in:title' --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file alert.md
          else
            gh issue create --title "Vanguard3 needs attention" --body-file alert.md
          fi
