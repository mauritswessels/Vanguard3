# Runs every test on each pull request, so a change is checked before it
# is merged (and before the evening run uses it).
name: Tests

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .

  # The platform in web/: type check, its tests (the numbers must match the
  # Python scoreboard), and a fresh build that must equal the committed
  # docs/ (so a change to web/src is never merged without its build).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Check the built site is up to date
        run: |
          npm run build
          changed=$(git status --porcelain -- ../docs/index.html ../docs/app ../docs/favicon.svg)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "docs/ is out of date: run 'npm run build' in web/ and commit docs/."
            exit 1
          fi
