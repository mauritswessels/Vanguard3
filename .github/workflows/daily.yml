# Runs the paper-trading agents every weekday after the New York close and
# publishes the results to the dashboard (GitHub Pages, served from docs/).
name: Daily paper trading

on:
  schedule:
    # The prices must be downloaded after New York has closed (16:00 there,
    # plus 30 minutes) but before midnight in Zurich: after that, Yahoo
    # leaves out the European markets' day (daily_run.py then leaves that
    # day for the next run). GitHub often starts a run 15-30 minutes late,
    # so there are several runs; one before the close, or one after a
    # successful run, finds nothing new and stops early.
    - cron: "40 20 * * 1-5"   # summer: 22:40 Zurich, 16:40 New York
    - cron: "5 21 * * 1-5"    # summer: a second chance before midnight
    - cron: "40 21 * * 1-5"   # winter: 22:40 Zurich, 16:40 New York
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Optional (healthchecks.io, free): it warns you when an evening
      # passes without a successful run, even one GitHub never started.
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      # The newest main, not the commit this run was started on: a run
      # that waited for another one must build on that one's results.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Prices first (see the schedule above), and the day's results are
      # saved straight away: nothing after this can lose them.
      - name: Advance paper accounts
        id: advance
        env:
          # Only the News Analyst uses it; without it that agent just waits.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python daily_run.py

      - name: Commit results
        if: steps.advance.outputs.new_sessions != '0'
        run: |
          git config user.name "vanguard3-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Paper trading update $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

      # A failure here sends the alert below.
      - name: Run tests
        if: steps.advance.outputs.new_sessions != '0'
        run: python -m unittest discover -s tests -t .

      # The 5-year backtest hardly moves in a day and is 4 MB, so it is
      # redone once a week (Fridays, or when the run is started by hand)
      # to keep the repository from growing by 4 MB every evening.
      - name: Backtest day?
        id: weekly
        run: |
          if [ "$(date -u +%u)" = 5 ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh 5-year backtest
        if: steps.advance.outputs.new_sessions != '0' && steps.weekly.outputs.refresh == 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: python main.py --source yfinance --days 1825 --dashboard --no-save

      - name: Commit backtest
        if: steps.advance.outputs.new_sessions != '0' && steps.weekly.outputs.refresh == 'true'
        run: |
          git add docs/data/backtest.json
          if ! git diff --cached --quiet; then
            git commit -m "Backtest update $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

      - name: Health check
        if: always()
        run: python health_check.py --out health.md

      # Opens (or adds to) one GitHub issue; GitHub emails it to the owner.
      - name: Alert if something went wrong
        if: always() && (job.status != 'success' || hashFiles('health.md') != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The **${{ github.workflow }}** run on $(date -u '+%a %d %b %H:%M UTC') needs a look."
            echo
            if [ "${{ job.status }}" != "success" ]; then
              echo "- The run itself stopped with an error. Log: $RUN_URL"
            fi
            [ -f health.md ] && cat health.md
            echo
            echo "@Mits-Alt-F4 · automatic message. Close this issue once things are fine again."
          } > alert.md
          n=$(gh issue list --state open --search '"Vanguard3 needs attention" in:title' --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file alert.md
          else
            gh issue create --title "Vanguard3 needs attention" --body-file alert.md
          fi

      # "All fine" whenever the accounts are up to date (also on market
      # holidays), "failed" when the run broke, and nothing while they are
      # behind: then healthchecks.io emails once the evening has passed.
      - name: Tell healthchecks.io
        if: always() && env.HEALTHCHECK_URL != ''
        run: |
          if [ "${{ job.status }}" != success ]; then
            url="$HEALTHCHECK_URL/fail"
          elif grep -qs "were last updated for" health.md; then
            exit 0
          else
            url="$HEALTHCHECK_URL"
          fi
          curl -fsS -m 30 --retry 3 "$url" > /dev/null || echo "healthchecks.io did not answer"
